# The gate `main` is protected by.
#
# Branch protection went on before this existed, which meant a rule that could
# require a pull request and nothing else: there was no check to be green.
# These jobs are what give it something to hold.
#
# Split in two on purpose. The first is the fast gate every push should clear;
# the second rasterises real pages in a container and is minutes slower, so a
# failure in one is legible without reading the other's log.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same branch cancels the first: the only run that matters
# is the one for the code as it stands now.
# PIN THE TOKEN SCOPE HERE, IN A FILE THAT SHOWS UP IN A DIFF. Without this
# block the job inherits the repository's default workflow permission, which is
# a checkbox in Settings -> Actions -- read today, and flippable to read/write
# by one click that changes NOTHING in git. These jobs compile, lint and run
# tests; none of them writes to the repository, so none of them needs a token
# that can. Declared at workflow level so a job added later starts closed.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: types, lint, boundaries, tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # --frozen-lockfile so a lockfile that drifted from package.json fails
      # here rather than resolving to something nobody has run.
      - run: pnpm install --frozen-lockfile

      # Chromium only: the browser project pins one browser, and pulling the
      # other two would be minutes spent on engines nothing here runs.
      # --with-deps because a bare runner has none of the shared libraries a
      # real Chromium needs.
      - run: pnpm exec playwright install --with-deps chromium

      - name: Typecheck
        run: pnpm exec tsc -b

      - name: Lint
        run: pnpm exec eslint . --max-warnings 0

      - name: Boundaries
        run: pnpm exec depcruise packages apps --config .dependency-cruiser.cjs

      # HEADLESS HERE, HEADED ON A DEVELOPER'S MACHINE, and that difference is
      # deliberate: vitest.config.ts leaves `headless` unset so it follows CI.
      # The two modes measure identically -- verified by running the whole
      # suite both ways, same totals -- and a future divergence is a real
      # signal about a box whose height a font is still deciding, never
      # something to bury under recalibrated constants.
      - name: Tests
        run: pnpm exec vitest run --project node --project browser

  visual:
    name: visual baselines
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # NO `lfs: true` HERE, ON PURPOSE -- see the cache block below. A plain
      # checkout brings down the POINTERS, which cost nothing, and the pointers
      # are what the cache key is computed from.
      - uses: actions/checkout@v4

      # THE BASELINES ARE IN GIT LFS, SO THIS CACHES THEM. Not because the
      # quota is tight -- an earlier version of this comment claimed it was,
      # and was wrong twice over. It read the repo's busiest single day (21 CI
      # runs while a feature branched eight ways) as the monthly average, and
      # it used a 1 GB/month LFS allowance that GitHub has since raised to
      # 10 GiB. Even on the inflated rate the real figure is ~1.45 GB against
      # 10 GiB: about 14% of budget, not over it.
      #
      # What the cache actually buys is time on every run, and headroom for
      # when the games still to come bring baselines of their own -- 4.2 MB is
      # comfortable, and a number several times that on a busy month would
      # stop being. The key is the OIDs rather than the files, so it changes
      # only when a baseline's CONTENT changes: the common run -- code moved,
      # pixels did not -- is a hit and fetches nothing.
      #
      # Keep the numbers honest if you touch this. A comment that manufactures
      # urgency gets the next decision made on a false premise, and this one
      # already did.
      #
      # This is an ACCELERATOR IN FRONT OF THE REAL STORE, never a substitute
      # for it. On a miss, `git lfs pull` goes to origin. A cache that answered
      # in place of the store would let the suite compare a baseline against
      # itself and pass green forever with a live regression underneath, which
      # is why the cache-as-storage option was rejected outright.
      #
      # Two ways it degrades, both harmless: Actions evicts an entry unused for
      # 7 days (costs one full fetch to re-warm), and a pull request from a fork
      # gets a read-only cache token (so it fetches, and saves nothing). Both
      # fall back to origin. Neither can manufacture a false pass.
      #
      # The key comes from a step OUTPUT rather than `hashFiles`, deliberately:
      # `hashFiles` resolves its argument relative to the workspace, so pointing
      # it at a scratch file outside would silently return the empty string. The
      # key would then be the constant `lfs-`, every run would hit the same
      # first-ever entry, and a changed baseline would quietly never be cached
      # again -- a slow leak that still passes, which is the worst kind.
      - name: LFS object key
        id: lfs-key
        run: echo "sha=$(git lfs ls-files -l | cut -d' ' -f1 | sort | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache LFS objects
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ steps.lfs-key.outputs.sha }}
          restore-keys: lfs-

      - name: Fetch the baselines
        run: git lfs pull

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # THE WORKSPACE HAS TO BE BUILT FIRST. Each package's `exports` points at
      # its `dist/`, so without this vite cannot resolve `@hexdev/truco-engine`
      # at all and every visual file dies on import rather than on a pixel.
      # Invisible locally, where `tsc -b` has always already run.
      - name: Build
        run: pnpm exec tsc -b

      # No `playwright install` step: this suite runs inside Microsoft's own
      # playwright image, which already carries the pinned browser, and the
      # bind-mounted host package resolves to it. That container is the whole
      # point -- the baselines are rasterised pages, and they only reproduce
      # when the OS, the fonts and the browser are pinned with them.
      - name: Visual
        run: pnpm run test:visual

      # A failed comparison is only readable as an image.
      - name: Upload the failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: |
            **/__screenshots__/**
          if-no-files-found: ignore
          retention-days: 7
